# Production copy of the whoami test service, on its public domain.
#
# Deployed by doco-cd as project "whoami-prod" from main. The image is pinned
# by digest, so only a merge from dev to main changes what production runs —
# the tag is here for readability and is not what selects the image.
#
# Digest verified against the registry before committing, not copied from a
# build log.
networks:
  traefik:
    external: true

services:
  whoami:
    image: ghcr.io/viswanathsaj/whoami:sha-f4c2e722f7d61034a499551f797d7c64b9abf4bd@sha256:aa602c721a2b745f15b8bad8a2a22fd7a61df5e75a02776651aba52a2e9f301e
    networks: [traefik]
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.whoami-prod.rule: "Host(`test.viswanathsaj.com`)"
      traefik.http.routers.whoami-prod.entrypoints: "websecure"
      # Production names the resolver so it gets a certificate for its own
      # public domain. Dev routers must NOT do this: they fall through to the
      # *.dev wildcard, which keeps internal hostnames out of the CT logs.
      traefik.http.routers.whoami-prod.tls.certresolver: "letsencrypt"
      traefik.http.services.whoami-prod.loadbalancer.server.port: "80"
